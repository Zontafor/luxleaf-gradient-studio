name: Faithful source verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify every pinned upstream file
        run: node .luxleaf/verify-source.mjs
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @shadergradient/react --filter @shadergradient/vue build
      - run: pnpm --filter ui build
      - run: pnpm --filter @shadergradient/figma-plugin plugin:build
      - run: pnpm --filter @shadergradient/framer-plugin --filter example-vue-dev build
      - run: pnpm --filter example-nextjs-dev build
      - run: node .luxleaf/verify-source.mjs
