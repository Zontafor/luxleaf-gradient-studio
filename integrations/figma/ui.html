<!doctype html><html lang="en"><meta charset="utf-8"><h2>LuxLeaf Gradient Import</h2><p>Select a PNG exported from Gradient Studio.</p><input type="file" accept="image/png" aria-label="Gradient PNG"><p role="status"></p><script>document.querySelector('input').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>8*1024*1024){document.querySelector('[role=status]').textContent='Use a PNG below 8 MiB';return;}parent.postMessage({pluginMessage:{type:'import-png',bytes:Array.from(new Uint8Array(await file.arrayBuffer()))}},'*');};</script></html>
